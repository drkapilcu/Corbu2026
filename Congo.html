<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152f">
<title>Congratulations — Next Stage</title>
<style>
  :root { --gold:#ffd66b; --white:#fff; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; min-height:100%; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body {
    min-height:100svh; overflow:hidden; color:var(--white);
    display:grid; place-items:center; text-align:center; padding:24px;
    background:linear-gradient(-45deg,#10152f,#33206a,#0c5266,#28184f);
    background-size:400% 400%; animation:bgShift 12s ease infinite;
  }
  @keyframes bgShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .glow {
    position:fixed; width:70vw; height:70vw; max-width:520px; max-height:520px;
    border-radius:50%; background:radial-gradient(circle,rgba(255,214,107,.20),transparent 68%);
    filter:blur(12px); animation:breathe 4s ease-in-out infinite; pointer-events:none;
  }
  @keyframes breathe { 0%,100%{transform:scale(.9);opacity:.55} 50%{transform:scale(1.12);opacity:1} }
  .card {
    position:relative; z-index:1; width:min(100%,430px); padding:34px 23px 30px;
    border:1px solid rgba(255,255,255,.24); border-radius:30px;
    background:rgba(255,255,255,.09); backdrop-filter:blur(14px);
    box-shadow:0 22px 70px rgba(0,0,0,.25);
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from{opacity:0;transform:translateY(24px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .medal { font-size:clamp(54px,16vw,76px); line-height:1.2; display:inline-block; animation:medalPop 1.1s .25s both, float 3s 1.4s ease-in-out infinite; }
  @keyframes medalPop { 0%{transform:scale(0) rotate(-30deg)} 70%{transform:scale(1.18) rotate(8deg)} 100%{transform:scale(1) rotate(0)} }
  @keyframes float { 0%,100%{translate:0 0} 50%{translate:0 -8px} }
  .eyebrow { margin:18px 0 10px; text-transform:uppercase; letter-spacing:.22em; font-size:.72rem; font-weight:800; color:var(--gold); }
  h1 { margin:0; font-size:clamp(2rem,8vw,3rem); line-height:1.08; letter-spacing:-.04em; text-shadow:0 0 28px rgba(255,214,107,.18); }
  h1 span { display:block; margin-top:8px; color:var(--gold); }
  .message { max-width:320px; margin:20px auto 25px; color:rgba(255,255,255,.84); font-size:1rem; line-height:1.6; }
  .pill { display:inline-flex; align-items:center; gap:9px; border:1px solid rgba(255,214,107,.5); border-radius:999px; padding:10px 15px; color:#fff4ce; background:rgba(255,214,107,.09); font-weight:700; font-size:.85rem; }
  .dot { width:8px;height:8px;border-radius:50%;background:#6fffc0;box-shadow:0 0 12px #6fffc0; }
  button { margin-top:25px; border:0; border-radius:999px; padding:15px 24px; width:100%; color:#21183c; background:linear-gradient(100deg,#ffe8a1,#ffc94f); font:800 1rem system-ui,sans-serif; cursor:pointer; box-shadow:0 8px 26px rgba(255,201,79,.24); animation:pulse 2.4s 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);box-shadow:0 8px 26px rgba(255,201,79,.22)} 50%{transform:scale(1.025);box-shadow:0 10px 34px rgba(255,201,79,.42)} }
  button:active { transform:scale(.98); }
  .foot { margin:20px 0 0; color:rgba(255,255,255,.55); font-size:.72rem; letter-spacing:.04em; }
  #confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<main class="card">
  <div class="medal" aria-hidden="true">🏆</div>
  <p class="eyebrow">A milestone achieved</p>
  <h1>Congratulations!<span>You’re in the<br>Next Stage</span></h1>
  <p class="message">Your hard work has brought you this far. One more step stands between you and the finish line.</p>
  <div class="pill"><span class="dot"></span> Next round unlocked</div>
  <button id="celebrate" type="button">Collect your next clue from <b>🧩DISCIPLINE IN-CHARGE🧩</b></button>
  <p class="foot">YOU’VE GOT THIS · KEEP GOING</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, pieces = [], raf;
  const colors = ['#ffd66b','#ffffff','#78f2d0','#a99bff','#ff91c8'];
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function burst(count=130) {
    for (let i=0;i<count;i++) {
      pieces.push({
        x:w*.5+(Math.random()-.5)*w*.55, y:h*.30+(Math.random()-.5)*h*.12,
        vx:(Math.random()-.5)*8, vy:Math.random()*-7-2,
        size:Math.random()*6+3, rot:Math.random()*6.28,
        spin:(Math.random()-.5)*.18, life:100+Math.random()*70,
        color:colors[Math.floor(Math.random()*colors.length)]
      });
    }
    if (!reduceMotion && !raf) animate();
    else if (reduceMotion) { drawStatic(); }
  }
  function drawStatic() {
    ctx.clearRect(0,0,w,h);
    pieces.slice(-45).forEach(p => { ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); });
  }
  function animate() {
    ctx.clearRect(0,0,w,h);
    pieces = pieces.filter(p => p.life > 0 && p.y < h+30);
    for (const p of pieces) {
      p.x += p.vx; p.y += p.vy; p.vy += .13; p.vx *= .993;
      p.rot += p.spin; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.globalAlpha=Math.min(1,p.life/28);
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.65); ctx.restore();
    }
    if (pieces.length) raf=requestAnimationFrame(animate);
    else { cancelAnimationFrame(raf); raf=null; }
  }
  resize(); window.addEventListener('resize',resize);
  burst(115);
  document.getElementById('celebrate').addEventListener('click',() => burst(180));
})();
</script>
</body>
</html>
