<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21152b">
<title>Better Luck Next Year</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{min-height:100svh;display:grid;place-items:center;padding:24px;overflow:hidden;text-align:center;color:#fff;background:linear-gradient(-45deg,#21152b,#482b48,#26344a,#4c2939);background-size:400% 400%;animation:bg 13s ease infinite}
  @keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .glow{position:fixed;width:75vw;height:75vw;max-width:520px;max-height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,153,174,.16),transparent 68%);filter:blur(10px);animation:breathe 4s ease-in-out infinite;pointer-events:none}
  @keyframes breathe{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
  .card{position:relative;z-index:1;width:min(100%,430px);padding:36px 24px 30px;border:1px solid rgba(255,255,255,.2);border-radius:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);box-shadow:0 22px 70px rgba(0,0,0,.28);animation:rise .85s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .emoji{font-size:clamp(64px,19vw,90px);line-height:1.25;display:inline-block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18));animation:sway 2.8s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-5px)}}
  .eyebrow{margin:20px 0 10px;text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;font-weight:800;color:#ffc4cf}
  h1{font-size:clamp(2.1rem,8vw,3rem);line-height:1.08;letter-spacing:-.04em;margin:0}
  h1 span{display:block;margin-top:9px;color:#ffc4cf}
  .message{max-width:310px;margin:22px auto 26px;color:rgba(255,255,255,.82);font-size:1rem;line-height:1.65}
  .pill{display:inline-flex;align-items:center;gap:9px;padding:10px 15px;border:1px solid rgba(255,196,207,.35);border-radius:999px;background:rgba(255,196,207,.08);color:#ffe5ea;font-size:.85rem;font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;background:#ffc4cf;box-shadow:0 0 12px #ffc4cf}
  button{margin-top:25px;width:100%;padding:15px 24px;border:0;border-radius:999px;background:linear-gradient(100deg,#ffe0e5,#ffb4c2);color:#351d30;font:800 1rem system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 26px rgba(255,180,194,.2);transition:transform .2s}
  button:active{transform:scale(.98)}
  .foot{margin:20px 0 0;color:rgba(255,255,255,.5);font-size:.72rem;letter-spacing:.06em}
  #sparkles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sparkles" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<main class="card">
  <div class="emoji" aria-hidden="true">👎</div>
  <p class="eyebrow">This time, it wasn’t meant to be</p>
  <h1>Sorry!<span>Better Luck<br>Next Year</span></h1>
  <p class="message">Every setback is a chance to learn, grow, and come back stronger. Keep going—your next opportunity is ahead.</p>
  <div class="pill"><span class="dot"></span> Try again next time</div>
  <button id="again" type="button">I’LL BE BACK 💪</button>
  <p class="foot">KEEP LEARNING · KEEP GROWING</p>
</main>
<script>
(() => {
 const c=document.getElementById('sparkles'),ctx=c.getContext('2d');let w,h,items=[],raf;
 const colors=['#ffc4cf','#ffffff','#d7c4ff','#ff9eaf'];
 function resize(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0)}
 function burst(){for(let i=0;i<65;i++)items.push({x:w/2+(Math.random()-.5)*w*.5,y:h*.35,vx:(Math.random()-.5)*3,vy:Math.random()*-3-1,r:Math.random()*3+1,life:80+Math.random()*40,color:colors[Math.floor(Math.random()*colors.length)]});if(!raf)draw()}
 function draw(){ctx.clearRect(0,0,w,h);items=items.filter(p=>p.life-->0&&p.y<h+10);for(const p of items){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(items.length)raf=requestAnimationFrame(draw);else raf=null}
 resize();addEventListener('resize',resize);burst();document.getElementById('again').addEventListener('click',burst);
})();
</script>
</body>
</html>
